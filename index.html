
<!DOCTYPE html>
<html>
<head>
    <title>Country Nickname Generator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>

<body>
    <div class="container">
        <h1>Southeast Asia</h1>
        <h2>Country Nickname Generator</h2>

        <div class="line"></div>

        <p>ENTER COUNTRY</p>

        <input type="text" id="country" placeholder="Type a country name">

        <br>

        <button py-click="nickname">IDENTIFY COUNTRY NICKNAME</button>

        <p id="result">AWAITING INPUT...</p>

        <div class="line"></div>

        <p class="footer">REGIONAL DATABASE // 001 <br> Seatwork 1 . 2nd Quarter</p>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
